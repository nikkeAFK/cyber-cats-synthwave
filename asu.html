<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Página de Anuncios</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* --- ESTILOS GENERALES --- */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-content {
            text-align: center;
            margin-bottom: 20px;
            max-width: 938px; /* Ancho máximo para coincidir con el contenedor de anuncios */
            width: 100%;
        }

        /* --- CONTENEDOR PRINCIPAL DE ANUNCIOS (FLEXBOX) --- */
        .ads-wrapper {
            display: flex;
            justify-content: center;
            gap: 15px; /* Espacio entre el contenido principal y la barra lateral */
            flex-wrap: wrap; /* Permite que la barra lateral se mueva debajo en pantallas pequeñas */
            max-width: 938px; /* 728px (banner) + 160px (sidebar) + 15px (gap) + 2*15px (padding) = 938px */
            width: 100%;
        }

        /* --- COLUMNA IZQUIERDA: ANUNCIOS PRINCIPALES --- */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 15px; /* Espacio entre anuncios en esta columna */
            flex-grow: 1; /* Permite que ocupe el espacio disponible */
        }
        
        /* --- COLUMNA DERECHA: BARRA LATERAL --- */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px; /* Espacio entre anuncios de la barra lateral */
            width: 160px; /* Ancho fijo para los anuncios verticales */
        }
        
        /* --- ESTILOS INDIVIDUALES PARA CADA BLOQUE DE ANUNCIO --- */
        /* Centra el contenido (iframe) dentro de cada bloque */
        .ad-block {
            background-color: #ffffff;
            border: 1px dashed #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 50px; /* Altura mínima para que el contenedor sea visible antes de que cargue el anuncio */
        }

        /* --- AJUSTE PARA MÓVILES (RESPONSIVIDAD) --- */
        @media (max-width: 900px) {
            .ads-wrapper {
                flex-direction: column; /* Apila las columnas una sobre otra */
                align-items: center; /* Centra los bloques */
            }
            .main-content {
                width: 100%;
                max-width: 728px; /* El ancho del banner más grande */
                align-items: center;
            }
        }
    </style>
</head>
