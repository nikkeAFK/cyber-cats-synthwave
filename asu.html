<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard de Anuncios con Auto-Refresh</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* --- ESTILOS GENERALES --- */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #333; /* Fondo oscuro para resaltar el dashboard */
            font-family: Arial, sans-serif;
            overflow: hidden; /* Evita cualquier scroll en la página */
        }

        /* --- CONTENEDOR PRINCIPAL (CSS GRID) --- */
        .ads-dashboard {
            display: grid;
            /* Definimos las columnas: 3 columnas con anchos fijos */
            grid-template-columns: 160px 320px 160px;
            /* Definimos las filas: una para el banner y otra para el contenido principal */
            grid-template-rows: 90px auto;
            gap: 10px; /* Espacio entre cada celda del grid */
            
            /* "Dibujamos" el layout */
            grid-template-areas:
                "header header header"
                "side-left center side-right";
            
            background-color: #f0f2f5;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* --- Estilo base para cada bloque de anuncio --- */
        .ad-block {
            background-color: #fff;
            border: 1px dashed #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- Asignamos cada ID a su área del grid --- */
        #ad-top-banner { grid-area: header; }
        #ad-skyscraper { grid-area: side-left; }
        .center-stack { grid-area: center; }
        #ad-half-skyscraper { grid-area: side-right; }
        
        /* Contenedor para los anuncios apilados en la columna central */
        .center-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="ads-dashboard">

        <div id="ad-top-banner" class="ad-block">
            <script type="text/javascript">
                atOptions = { 'key' : 'c7009b142f4109549dc34b01d1665638', 'format' : 'iframe', 'height' : 90, 'width' : 728, 'params' : {} };

    <script async="async" data-cfasync="false" src="//minkfrequent.com/c10514074ff0e5a5ae0d02570d90bdaf/invoke.js"></script>
    <div id="container-c10514074ff0e5a5ae0d02570d90bdaf"></div>

    <script>
        // Esperamos a que toda la página se haya cargado
        document.addEventListener('DOMContentLoaded', function () {
            
            // Seleccionamos todos los contenedores de anuncios que queremos recargar
            const adBlocksToRefresh = document.querySelectorAll('.ad-block');
            
            // Creamos un mapa para guardar el contenido HTML original de cada anuncio
            const originalAdContent = new Map();
            adBlocksToRefresh.forEach(block => {
                originalAdContent.set(block, block.innerHTML);
            });

            // Función que se encargará de recargar los anuncios
            function refreshAds() {
                console.log('🔄 Recargando anuncios...');
                adBlocksToRefresh.forEach(block => {
                    // Reemplazamos el contenido del bloque con su script original
                    // Esto fuerza al navegador a ejecutar el script de nuevo
                    block.innerHTML = originalAdContent.get(block);
                });
            }

            // Establecemos el intervalo de tiempo
            // 2 minutos = 120 segundos = 120,000 milisegundos
            const twoMinutes = 0.01 * 60 * 1000; 
            
            setInterval(refreshAds, twoMinutes);
        });
    </script>
