    <meta charset="UTF-8">
    <title>Página de Anuncios Compacta</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* --- ESTILOS GENERALES --- */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-content {
            text-align: center;
            margin-bottom: 20px;
            max-width: 700px; /* Ancho ajustado al nuevo layout compacto */
            width: 100%;
        }

        /* --- CONTENEDOR PRINCIPAL DE ANUNCIOS (FLEXBOX) --- */
        .ads-wrapper {
            display: flex;
            justify-content: center;
            gap: 15px; /* Espacio entre el contenido principal y la barra lateral */
            flex-wrap: wrap; /* Permite que la barra lateral se mueva debajo en pantallas pequeñas */
            max-width: 700px; /* Ancho total reducido: 546px + 120px + 15px gap */
            width: 100%;
        }

        /* --- COLUMNA IZQUIERDA: ANUNCIOS PRINCIPALES --- */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        /* --- COLUMNA DERECHA: BARRA LATERAL --- */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            /* El ancho ahora es de 120px (160px * 0.75) */
            width: 120px; 
        }
        
        /* --- ESTILO GENERAL PARA BLOQUES DE ANUNCIO --- */
        .ad-block {
            background-color: #ffffff;
            border: 1px dashed #ccc;
            overflow: hidden; /* Oculta cualquier parte del iframe que se salga del contenedor */
            position: relative; /* Necesario para la transformación */
        }
        
        /* --- ✨ LA MAGIA DE LA REDUCCIÓN DE TAMAÑO --- */
        .ad-block iframe {
            /* Escala el iframe al 75% de su tamaño */
            transform: scale(0.75);
            /* Asegura que la escala se haga desde la esquina superior izquierda */
            transform-origin: 0 0;
        }

        /* --- TAMAÑOS FIJOS PARA CADA CONTENEDOR (75% del original) --- */
        #ad-top-banner {
            width: 546px;  /* 728 * 0.75 */
            height: 67.5px; /* 90 * 0.75 */
        }
        #ad-medium-rect {
            width: 225px;   /* 300 * 0.75 */
            height: 187.5px;/* 250 * 0.75 */
        }
        #ad-mobile-banner {
            width: 240px;   /* 320 * 0.75 */
            height: 37.5px; /* 50 * 0.75 */
        }
        #ad-skyscraper {
            width: 120px;   /* 160 * 0.75 */
            height: 450px;  /* 600 * 0.75 */
        }
        #ad-small-skyscraper {
            width: 120px;   /* 160 * 0.75 */
            height: 225px;  /* 300 * 0.75 */
        }

        /* --- AJUSTE PARA MÓVILES --- */
        @media (max-width: 720px) {
            .ads-wrapper {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
