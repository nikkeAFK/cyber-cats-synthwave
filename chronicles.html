<body>
    <div class="background-grid"></div>

    <nav class="main-nav">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#donacion">Donación</a></li>
            <li><a href="chronicles.html" style="color: var(--neon-pink);">Glorious Chronicles</a></li>
        </ul>
    </nav>

    <header class="game-header"></header>

    <main class="content-section" style="padding-top: 100px;">
        <h2 class="neon-text-pink">Glorious Chronicles</h2>
        <p style="text-align: center; font-size: 1.2em;">El salón de la fama para las leyendas de CYBERCAT. Aquí se inmortalizan las hazañas de aquellos que han alcanzado la cima.</p>
        
        <hr style="border-color: var(--neon-purple); margin: 40px 0;">

        <div id="chronicles-content">
            <p>Cargando crónicas...</p>
        </div>
    </main>

    <footer class="game-footer">

        <p class="legal-links">

        </p>
        </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const contentDiv = document.getElementById('chronicles-content');

            // Usamos fetch para leer tu futuro archivo 'historias.md'
            fetch('historias.md')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('No se pudo encontrar el archivo de crónicas.');
                    }
                    return response.text();
                })
                .then(markdownText => {
                    // Usamos la librería marked para convertir el texto a HTML
                    contentDiv.innerHTML = marked.parse(markdownText);
                })
                .catch(error => {
                    console.error('Error al cargar las crónicas:', error);
                    contentDiv.innerHTML = '<p style="color: red;">No se pudieron cargar las crónicas. Asegúrate de que el archivo "historias.md" exista.</p>';
                });
        });
    </script>
</body>
