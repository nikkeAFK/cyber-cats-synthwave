<body>
    <div class="background-grid"></div>

    <nav class="main-nav">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#donacion">Donation</a></li>
            <li><a href="chronicles.html" style="color: var(--neon-pink);">Glorious Chronicles</a></li>
        </ul>
    </nav>

    <header class="game-header"></header>

    <main class="content-section" style="padding-top: 100px;">
        <h2 class="chronicles-title">Glorious Chronicles</h2>
        <p class="chronicles-subtitle">The hall of fame for the legends of CYBERCAT. Here, the deeds of those who have reached the top are immortalized.</p>
        
        <hr style="border-color: var(--neon-purple); margin: 40px 0;">

        <div id="chronicles-content">
            <p>Loading chronicles...</p>
        </div>
    </main>

    <footer class="game-footer">
        <p>&copy; 2025 CYBERCAT-SYNTHWAVE. All rights reserved.</p>
        <p class="legal-links">

        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const contentDiv = document.getElementById('chronicles-content');

            fetch('historias.md')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Could not find the chronicles file.');
                    }
                    return response.text();
                })
                .then(markdownText => {
                    contentDiv.innerHTML = marked.parse(markdownText);
                })
                .catch(error => {
                    console.error('Error loading the chronicles:', error);
                    contentDiv.innerHTML = '<p style="color: red;">Could not load chronicles. Make sure the "historias.md" file exists.</p>';
                });
        });
    </script>
